name: Curriculum

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Convert markdown to JSON
        run: python3 scripts/markdown_to_json.py --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: lionlingo-content-json
          path: dist
          if-no-files-found: error
